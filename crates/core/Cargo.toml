[package]
name = "rayo-core"
description = "The PyO3 extension module binding Rayo's Rust crates to Python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "_core"
# rlib alongside cdylib so `cargo test` can exercise this crate directly.
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
pyo3 = { workspace = true }
rayo-dispatch = { workspace = true }
rayo-router = { workspace = true }
rayo-schema = { workspace = true }
rayo-server = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

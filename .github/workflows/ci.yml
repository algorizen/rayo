name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.14"

jobs:
  lint:
    name: Lint (ruff, mypy, fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
      - name: Sync (builds the extension)
        run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-tests:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # uv here only provides a Python for pyo3 to link against; nothing is
      # uv-installed, so the download cache must be off or the post-step fails.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          enable-cache: false
      - run: cargo test --workspace

  dispatch-budget:
    name: Dispatch boundary budget (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The budget must hold on BOTH interpreter builds (ADR-0002).
        python: ["3.12", "3.14t"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Point pyo3 at the matrix interpreter
        # The gate embeds Python: pyo3 must build against — and the test
        # binary must find at runtime — this interpreter's libpython. The
        # explicit install matters: `uv python find` does not download, and
        # free-threaded builds are never preinstalled on runners.
        run: |
          uv python install ${{ matrix.python }}
          python_binary="$(uv python find ${{ matrix.python }})"
          echo "PYO3_PYTHON=${python_binary}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$("${python_binary}" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')" >> "$GITHUB_ENV"
      - run: cargo test --release -p rayo-dispatch --test boundary_budget -- --ignored --nocapture

  python-tests:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.14t is the free-threaded build — a first-class target (ADR-0002):
        # the suite must pass on BOTH interpreter builds, not just GIL ones.
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Sync (builds the extension)
        run: uv sync --group dev
      - run: uv run pytest

  wheel-dry-run:
    name: Wheel build dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build manylinux wheels + sdist
        uses: PyO3/maturin-action@v1
        with:
          command: build
          # One GIL and one free-threaded wheel — a dry run of the release path.
          args: --release --out dist --sdist --interpreter 3.12 3.14t
          manylinux: auto
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the cp312 wheel and import it
        run: |
          python -m pip install --only-binary ':all:' --no-index --find-links dist rayo
          python -c "import rayo; print('rayo', rayo.__version__, 'imports OK')"
